<svg width="720" height="330" viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace">
  <defs>
    <clipPath id="round">
      <rect x="0" y="0" width="720" height="330" rx="10" ry="10"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect x="0" y="0" width="720" height="330" fill="#1e1e2e"/>

    <rect x="0" y="0" width="720" height="32" fill="#181825"/>
    <circle cx="21" cy="16" r="5.5" fill="#f38ba8"/>
    <circle cx="41" cy="16" r="5.5" fill="#f9e2af"/>
    <circle cx="61" cy="16" r="5.5" fill="#a6e3a1"/>
    <text x="360" y="20.5" text-anchor="middle" fill="#6c7086" font-size="12">zsh — 90x24</text>

    <!-- ===== Powerline prompt (single line, muted, real p10k proportions) ===== -->
    <!-- git segment (bottom layer) -->
    <polygon points="196,52 288,52 300,63 288,74 196,74" fill="#3c5a3c"/>
    <circle cx="211" cy="59" r="2" fill="#a6e3a1"/>
    <circle cx="211" cy="67" r="2" fill="#a6e3a1"/>
    <line x1="211" y1="59" x2="211" y2="67" stroke="#a6e3a1" stroke-width="1.2"/>
    <line x1="211" y1="62" x2="218" y2="59" stroke="#a6e3a1" stroke-width="1.2"/>
    <text x="225" y="67" font-size="12.5" fill="#c8e6c9">main</text>

    <!-- dir segment (top layer) -->
    <polygon points="24,52 196,52 208,63 196,74 24,74" fill="#2f4d73"/>
    <text x="38" y="67" font-size="12.5" fill="#cdd6f4">~/dev/OopsNooob</text>

    <!-- ===== Command line ===== -->
    <text x="24" y="100" font-size="13" fill="#a6e3a1">❯</text>
    <text x="42" y="100" font-size="13" fill="#f5e0dc">whoami</text>

    <!-- ===== Plain terminal output ===== -->
    <g font-size="13">
      <text x="24" y="130" fill="#89b4fa">Name</text>
      <text x="168" y="130" fill="#cdd6f4">Do Dinh Khang</text>

      <text x="24" y="152" fill="#89b4fa">Role</text>
      <text x="168" y="152" fill="#cdd6f4">Software Engineer (Web &amp; Mobile)</text>

      <text x="24" y="174" fill="#89b4fa">University</text>
      <text x="168" y="174" fill="#cdd6f4">University of Information Technology (UIT)</text>

      <text x="24" y="196" fill="#89b4fa">Location</text>
      <text x="168" y="196" fill="#cdd6f4">Ho Chi Minh City, Vietnam</text>

      <text x="24" y="218" fill="#89b4fa">Pronouns</text>
      <text x="168" y="218" fill="#cdd6f4">He / Him</text>

      <text x="24" y="240" fill="#89b4fa">Status</text>
      <text x="168" y="240" fill="#a6e3a1">Building cool stuff 🚀</text>
    </g>

    <!-- ===== Trailing prompt with blinking cursor ===== -->
    <text x="24" y="272" font-size="13" fill="#a6e3a1">❯</text>
    <rect x="42" y="260" width="8" height="15" fill="#f5e0dc">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="719" height="329" rx="10" ry="10" fill="none" stroke="#313244" stroke-width="1"/>
</svg>
